<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Drop Shadow -->
    <filter id="buildShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.55"/>
    </filter>

    <!-- Token Base Gradient -->
    <radialGradient id="buildBase" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#e67e22"/>
      <stop offset="60%" stop-color="#b03a16"/>
      <stop offset="100%" stop-color="#561706"/>
    </radialGradient>

    <!-- Wood Handle Gradient -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0a96d"/>
      <stop offset="50%" stop-color="#9a6133"/>
      <stop offset="100%" stop-color="#5a3112"/>
    </linearGradient>

    <!-- Steel / Iron Hammer Head Gradient -->
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="40%" stop-color="#94a3b8"/>
      <stop offset="85%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Gold Brass Accents -->
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffeaa7"/>
      <stop offset="50%" stop-color="#fdcb6e"/>
      <stop offset="100%" stop-color="#b7791f"/>
    </linearGradient>
  </defs>

  <!-- Base Circle Token -->
  <circle cx="32" cy="33" r="28" fill="#300d04" filter="url(#buildShadow)"/>
  <circle cx="32" cy="32" r="28" fill="url(#buildBase)" stroke="#f39c12" stroke-width="1.8"/>
  <circle cx="32" cy="32" r="25" fill="none" stroke="#fcd890" stroke-width="0.8" stroke-opacity="0.4" stroke-dasharray="2 2"/>

  <!-- Crossed Tools: 1. Chisel/Compass Angle (-45 deg) -->
  <g transform="rotate(-45 32 32)">
    <!-- Chisel Handle -->
    <rect x="29.5" y="16" width="5" height="26" rx="2" fill="url(#woodGrad)" stroke="#3d1f08" stroke-width="0.7"/>
    <!-- Brass Collar -->
    <rect x="29" y="38" width="6" height="3" rx="0.5" fill="url(#brassGrad)" stroke="#5c3c04" stroke-width="0.6"/>
    <!-- Chisel Steel Blade -->
    <polygon points="29.5,41 34.5,41 33.5,50 30.5,50" fill="url(#steelGrad)" stroke="#1a202c" stroke-width="0.7"/>
    <polygon points="30.5,50 33.5,50 33,52 31,52" fill="#cbd5e1"/>
  </g>

  <!-- Crossed Tools: 2. Heavy Carpenter's Mallet (+45 deg) -->
  <g transform="rotate(45 32 32)">
    <!-- Mallet Wood Handle -->
    <rect x="29.5" y="18" width="5" height="28" rx="2" fill="url(#woodGrad)" stroke="#3d1f08" stroke-width="0.7"/>
    <!-- Brass Ring -->
    <rect x="29" y="22" width="6" height="2.5" rx="0.5" fill="url(#brassGrad)" stroke="#5c3c04" stroke-width="0.6"/>
    <!-- Heavy Wooden/Stone Mallet Head -->
    <rect x="22" y="12" width="20" height="11" rx="2.5" fill="url(#steelGrad)" stroke="#1e293b" stroke-width="0.8" filter="url(#buildShadow)"/>
    <!-- Mallet Face Plates (Left & Right) -->
    <rect x="21" y="13" width="2.5" height="9" rx="1" fill="url(#brassGrad)" stroke="#5c3c04" stroke-width="0.5"/>
    <rect x="40.5" y="13" width="2.5" height="9" rx="1" fill="url(#brassGrad)" stroke="#5c3c04" stroke-width="0.5"/>
    <line x1="32" y1="12" x2="32" y2="23" stroke="#334155" stroke-width="1"/>
  </g>

  <!-- Central Stamped Rivet / Shield -->
  <circle cx="32" cy="32" r="4.5" fill="url(#brassGrad)" stroke="#5c3c04" stroke-width="0.8" filter="url(#buildShadow)"/>
  <circle cx="32" cy="32" r="2.2" fill="#ffeaa7"/>

  <!-- Token Top Glare -->
  <path d="M 14 26 A 25 25 0 0 1 50 26 C 42 30 22 30 14 26 Z" fill="#ffffff" opacity="0.18"/>
</svg>
